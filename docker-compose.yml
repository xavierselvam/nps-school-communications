version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nps_postgres
    environment:
      POSTGRES_USER: nps
      POSTGRES_PASSWORD: nps_password
      POSTGRES_DB: nps_communications
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
